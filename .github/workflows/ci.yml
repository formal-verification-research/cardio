name: CI

on:
  push:
    branches: [main, fix/probability-zero]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpython3-dev
      - name: Create virtualenv and install Python deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install maturin numpy scipy pytest
      - name: Build extension
        run: .venv/bin/maturin develop
      - name: Run Python tests
        run: .venv/bin/python -m pytest tests/ -q
